<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a"><title>Pierre Financeiro</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--primary:#2563eb;--green:#16a34a;--red:#dc2626;--dark:#0f172a;--shadow:0 8px 25px #17203312}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:20px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:24px;font-weight:800}.brand span{color:var(--primary)}.top small{color:var(--muted)}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:12px;margin-bottom:18px}.nav button{white-space:nowrap;padding:10px 14px;border-radius:12px;background:transparent;color:var(--muted)}.nav button.active{background:var(--dark);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.metric small,.muted{color:var(--muted)}.metric strong{display:block;font-size:24px;margin-top:8px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px}.section-head h2{font-size:18px;margin:0}.btn{background:var(--primary);color:white;padding:10px 14px;border-radius:11px;font-weight:700}.btn.secondary{background:#e8eefc;color:#1d4ed8}.btn.gray{background:#eef0f4;color:#374151}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{padding:7px 10px;font-size:13px}.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.account-card{position:relative;overflow:hidden}.account-card:after{content:'';position:absolute;width:100px;height:100px;border-radius:50%;right:-35px;top:-35px;background:#2563eb14}.account-type{font-size:12px;color:var(--muted)}.balance{font-size:25px;font-weight:800;margin:12px 0}.positive{color:var(--green)}.negative{color:var(--red)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:flex;flex-direction:column;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef0f4;color:#4b5563}.pill.green{background:#dcfce7;color:#166534}.pill.red{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:14px}.pie-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.pie{width:190px;height:190px;border-radius:50%;background:conic-gradient(#2563eb 0 100%);flex:none}.legend{display:flex;flex-direction:column;gap:8px}.legend-row{display:flex;align-items:center;gap:8px}.dot{width:11px;height:11px;border-radius:50%;background:var(--color)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:14px}.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-bg.show{display:flex}.modal{background:white;border-radius:20px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:20px}.modal h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700;color:#4b5563}.field input,.field select{padding:11px;border:1px solid #d1d5db;border-radius:10px;background:white}.hidden{display:none!important}.invoice{border:1px solid var(--line);border-radius:14px;padding:14px}.invoice+.invoice{margin-top:10px}.footer-note{font-size:12px;color:var(--muted);margin-top:20px}.mobile-bottom{display:none}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cards-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.app{padding:14px 12px 85px}.grid,.cards-grid{grid-template-columns:1fr 1fr;gap:9px}.card{padding:14px}.metric strong{font-size:19px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start}.brand{font-size:21px}.mobile-bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:8px}.mobile-bottom button{background:none;color:var(--muted);font-size:11px}.mobile-bottom button.active{color:var(--primary);font-weight:800}}
</style></head>
<body><div class="app">
<header class="top"><div><div class="brand">Pierre <span>Financeiro</span></div><small>Seu controle financeiro pessoal</small></div><button class="btn small" onclick="openTransaction()">+ Lançamento</button></header>
<nav class="nav" id="nav"></nav><main id="content"></main><div class="footer-note">Seus dados ficam salvos neste navegador. Faça backups regularmente.</div></div><div class="mobile-bottom" id="bottomNav"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<script>
const KEY='pierre_financeiro_v4';
const oldKeys=['pierre_financeiro','pierre_financeiro_v3','pierreFinanceiro','pfData'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dateBR=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'';
const today=()=>new Date().toISOString().slice(0,10);
let data=load();let page='resumo';
function blank(){return {version:4,accounts:[],cards:[],categories:[{id:uid(),name:'Salário',type:'income'},{id:uid(),name:'Uber',type:'income'},{id:uid(),name:'Alimentação',type:'expense'},{id:uid(),name:'Transporte',type:'expense'},{id:uid(),name:'Moradia',type:'expense'},{id:uid(),name:'Lazer',type:'expense'},{id:uid(),name:'Outros',type:'expense'}],transactions:[],installments:[],payments:[]}}
function safeGet(key){try{return window.localStorage.getItem(key)}catch(e){return null}}
function safeSet(key,value){try{window.localStorage.setItem(key,value);return true}catch(e){return false}}
function load(){let raw=safeGet(KEY);if(!raw)for(const k of oldKeys){raw=safeGet(k);if(raw)break}if(!raw)return blank();try{return normalize(JSON.parse(raw))}catch{return blank()}}
function normalize(x){let d=blank();Object.assign(d,x);d.accounts=d.accounts||[];d.cards=d.cards||[];d.categories=d.categories||blank().categories;d.transactions=d.transactions||[];d.installments=d.installments||[];d.payments=d.payments||[];return d}
function save(){safeSet(KEY,JSON.stringify(data))}
function nav(){let items=[['resumo','Resumo'],['lancamentos','Lançamentos'],['contas','Contas'],['categorias','Categorias'],['config','Configurações']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('bottomNav').innerHTML=items.slice(0,4).map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){page=p;render()}
function render(){nav();({resumo:renderResumo,lancamentos:renderLancamentos,contas:renderContas,categorias:renderCategorias,config:renderConfig}[page])()}
function accountBalance(id){let a=data.accounts.find(x=>x.id===id);if(!a)return 0;let v=Number(a.initialBalance||0);data.transactions.forEach(t=>{if(t.accountId===id&&t.payment!=='credit')v+=t.type==='income'?Number(t.amount): -Number(t.amount)});data.payments.filter(p=>p.accountId===id).forEach(p=>v-=Number(p.amount));return v}
function monthKey(s){return (s||'').slice(0,7)}
function monthName(k){return new Date(k+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function currentMonth(){return today().slice(0,7)}
function expenseRows(month){let rows=[];data.transactions.filter(t=>t.type==='expense'&&t.payment!=='credit'&&monthKey(t.date)===month).forEach(t=>rows.push({cat:t.categoryId,amount:Number(t.amount)}));data.installments.filter(i=>monthKey(i.dueDate)===month).forEach(i=>rows.push({cat:i.categoryId,amount:Number(i.amount)}));return rows}
function sumIncome(month){return data.transactions.filter(t=>t.type==='income'&&monthKey(t.date)===month).reduce((s,t)=>s+Number(t.amount),0)}
function sumExpense(month){return expenseRows(month).reduce((s,x)=>s+x.amount,0)}
function renderResumo(){let m=currentMonth(),total=data.accounts.reduce((s,a)=>s+accountBalance(a.id),0),inc=sumIncome(m),exp=sumExpense(m),unpaid=data.installments.filter(i=>!isPaid(i));let invoices=invoiceGroups().filter(i=>!i.paid).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));let next=invoices[0];let groups={};let rows=expenseRows(m);rows.forEach(r=>groups[r.cat]=(groups[r.cat]||0)+r.amount);let totalPie=Object.values(groups).reduce((a,b)=>a+b,0)||1;let colors=['#2563eb','#16a34a','#f59e0b','#dc2626','#9333ea','#0891b2','#64748b'];let slices=Object.entries(groups);let angle=0,parts=slices.map(([,v],i)=>{let start=angle;angle+=v/totalPie*360;return `${colors[i%colors.length]} ${start}deg ${angle}deg`}).join(',');document.getElementById('content').innerHTML=`<div class="grid"><div class="card metric"><small>Saldo total</small><strong class="${total>=0?'positive':'negative'}">${money(total)}</strong></div><div class="card metric"><small>Entradas do mês</small><strong class="positive">${money(inc)}</strong></div><div class="card metric"><small>Gastos do mês</small><strong class="negative">${money(exp)}</strong></div><div class="card metric"><small>Faturas futuras</small><strong>${money(unpaid.reduce((s,i)=>s+Number(i.amount),0))}</strong></div></div><div class="section-head"><h2>Resumo de ${monthName(m)}</h2><div class="actions"><button class="btn secondary small" onclick="openTransaction('income')">+ Ganho</button><button class="btn small" onclick="openTransaction('expense')">+ Gasto</button></div></div><div class="card"><div class="row"><h3>Distribuição de gastos</h3><span class="muted">Por categoria</span></div>${slices.length?`<div class="pie-wrap"><div class="pie" style="background:conic-gradient(${parts})"></div><div class="legend">${slices.map(([id,v],i)=>`<div class="legend-row"><i class="dot" style="--color:${colors[i%colors.length]}"></i><span>${catName(id)}: <b>${money(v)}</b></span></div>`).join('')}</div></div>`:`<div class="empty">Ainda não há gastos neste mês.</div>`}</div><div class="section-head"><h2>Próximos compromissos</h2><button class="btn gray small" onclick="go('contas')">Ver contas</button></div><div class="card">${next?`<div class="row"><div><b>${next.cardName}</b><div class="muted">Vencimento ${dateBR(next.dueDate)}</div></div><div style="text-align:right"><b>${money(next.amount)}</b><div class="muted">${Math.max(1,Math.ceil((new Date(next.dueDate)-new Date())/86400000))} dias restantes</div></div></div>`:`<div class="empty">Nenhuma fatura pendente encontrada.</div>`}</div>`}
function catName(id){return data.categories.find(c=>c.id===id)?.name||'Sem categoria'}
function isPaid(i){return data.payments.some(p=>p.invoiceKey===i.invoiceKey)}
function invoiceGroups(){let map={};data.installments.forEach(i=>{let c=data.cards.find(c=>c.id===i.cardId);let key=i.cardId+'_'+monthKey(i.dueDate);if(!map[key])map[key]={key,cardId:i.cardId,cardName:c?.name||'Cartão',dueDate:dueForMonth(c,monthKey(i.dueDate)),amount:0,items:[],paid:false};map[key].amount+=Number(i.amount);map[key].items.push(i);map[key].paid=isPaid({invoiceKey:key})});return Object.values(map)}
function dueForMonth(c,m){if(!c)return m+'-10';let [y,mo]=m.split('-').map(Number);let day=Math.min(Number(c.dueDay||10),new Date(y,mo,0).getDate());return `${m}-${String(day).padStart(2,'0')}`}
function renderLancamentos(){let ts=[...data.transactions].sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('content').innerHTML=`<div class="section-head"><h2>Lançamentos</h2><button class="btn" onclick="openTransaction()">+ Novo lançamento</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Conta/cartão</th><th>Forma</th><th>Valor</th><th></th></tr></thead><tbody>${ts.length?ts.map(t=>{let source=t.payment==='credit'?data.cards.find(c=>c.id===t.cardId)?.name:data.accounts.find(a=>a.id===t.accountId)?.name;return `<tr><td>${dateBR(t.date)}</td><td><span class="pill ${t.type==='income'?'green':'red'}">${t.type==='income'?'Ganho':'Gasto'}</span></td><td>${catName(t.categoryId)}</td><td>${source||'-'}</td><td>${t.payment==='credit'?'Crédito':t.payment}</td><td class="${t.type==='income'?'positive':'negative'}"><b>${t.type==='income'?'+':'-'} ${money(t.amount)}</b>${t.payment==='credit'?`<br><small>${t.installments}x</small>`:''}</td><td><button class="btn danger small" onclick="removeTransaction('${t.id}')">Apagar</button></td></tr>`}).join(''):`<tr><td colspan="7"><div class="empty">Nenhum lançamento cadastrado.</div></td></tr>`}</tbody></table></div></div>`}
function renderContas(){let inv=invoiceGroups().sort((a,b)=>a.dueDate.localeCompare(b.dueDate));document.getElementById('content').innerHTML=`<div class="section-head"><h2>Contas e cartões</h2><div class="actions"><button class="btn secondary" onclick="openAccount()">+ Conta</button><button class="btn" onclick="openCard()">+ Cartão</button></div></div><div class="cards-grid">${data.accounts.map(a=>`<div class="card account-card"><div class="account-type">${a.type==='cash'?'Carteira / dinheiro':'Conta bancária'}</div><h3>${a.name}</h3><div class="balance ${accountBalance(a.id)>=0?'positive':'negative'}">${money(accountBalance(a.id))}</div><div class="muted">Saldo inicial: ${money(a.initialBalance)}</div><div class="actions" style="margin-top:14px"><button class="btn small" onclick="accountDetail('${a.id}')">Abrir central</button><button class="btn gray small" onclick="editAccount('${a.id}')">Editar</button></div></div>`).join('')||'<div class="empty">Nenhuma conta cadastrada.</div>'}</div><div class="section-head"><h2>Cartões</h2></div><div class="cards-grid">${data.cards.map(c=>`<div class="card"><div class="account-type">Cartão de crédito</div><h3>${c.name}</h3><div class="muted">Conta: ${data.accounts.find(a=>a.id===c.accountId)?.name||'Não vinculada'}</div><div class="muted">Vencimento: dia ${c.dueDay||10} · Fechamento: ${c.closingDay||'não informado'}</div><div class="balance">Fatura em aberto: ${money(inv.filter(i=>i.cardId===c.id&&!i.paid).reduce((s,i)=>s+i.amount,0))}</div><button class="btn small" onclick="cardDetail('${c.id}')">Ver faturas</button></div>`).join('')||'<div class="empty">Nenhum cartão cadastrado.</div>'}</div><div class="section-head"><h2>Faturas futuras</h2></div><div class="card">${inv.length?inv.map(i=>`<div class="invoice"><div class="row"><div><b>${i.cardName}</b><div class="muted">Vencimento ${dateBR(i.dueDate)}</div></div><div style="text-align:right"><b>${money(i.amount)}</b><br><span class="pill ${i.paid?'green':'red'}">${i.paid?'Paga':'Pendente'}</span></div></div>${!i.paid?`<div class="actions" style="margin-top:10px"><button class="btn small" onclick="payInvoice('${i.key}')">Pagar fatura</button><button class="btn gray small" onclick="invoiceDetail('${i.key}')">Detalhes</button></div>`:''}</div>`).join(''):'<div class="empty">Nenhuma fatura gerada.</div>'}</div>`}
function renderCategorias(){document.getElementById('content').innerHTML=`<div class="section-head"><h2>Categorias</h2><button class="btn" onclick="openCategory()">+ Categoria</button></div><div class="card list">${data.categories.map(c=>`<div class="item"><div><b>${c.name}</b><div class="muted">${c.type==='income'?'Ganhos':c.type==='expense'?'Gastos':'Geral'}</div></div><button class="btn danger small" onclick="removeCategory('${c.id}')">Apagar</button></div>`).join('')}</div>`}
function renderConfig(){document.getElementById('content').innerHTML=`<div class="section-head"><h2>Configurações</h2></div><div class="card"><h3>Backup dos seus dados</h3><p class="muted">Exporte tudo antes de trocar de navegador, atualizar o app ou usar a guia anônima.</p><div class="actions"><button class="btn" onclick="backup()">Exportar backup</button><label class="btn secondary">Restaurar backup<input type="file" accept=".json" hidden onchange="restore(event)"></label></div></div><div class="card" style="margin-top:14px"><h3>Manutenção</h3><p class="muted">A restauração substitui os dados atuais pelos dados do arquivo selecionado.</p><button class="btn danger" onclick="clearAll()">Apagar todos os dados</button></div>`}
function modal(content){document.getElementById('modal').innerHTML=content;document.getElementById('modalBg').classList.add('show')};function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function openTransaction(type='expense',edit=null){let t=edit?data.transactions.find(x=>x.id===edit):null;modal(`<h2>${t?'Editar':'Novo'} lançamento</h2><div class="form-grid"><div class="field"><label>Tipo</label><select id="tType" onchange="toggleTransactionFields()"><option value="expense" ${(!t||t.type==='expense')?'selected':''}>Gasto</option><option value="income" ${t?.type==='income'?'selected':''}>Ganho</option></select></div><div class="field"><label>Data</label><input id="tDate" type="date" value="${t?.date||today()}"></div><div class="field"><label>Valor total</label><input id="tAmount" type="number" step="0.01" value="${t?.amount||''}" placeholder="0,00"></div><div class="field"><label>Categoria</label><select id="tCat">${data.categories.map(c=>`<option value="${c.id}" ${c.id===t?.categoryId?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field full" id="paymentField"><label>Forma de pagamento</label><select id="tPayment" onchange="toggleTransactionFields()"><option value="pix">Pix</option><option value="cash">Dinheiro</option><option value="debit">Débito</option><option value="credit">Crédito</option></select></div><div class="field" id="accountField"><label>Conta</label><select id="tAccount">${data.accounts.map(a=>`<option value="${a.id}" ${a.id===t?.accountId?'selected':''}>${a.name}</option>`).join('')}</select></div><div class="field hidden" id="cardField"><label>Cartão</label><select id="tCard">${data.cards.map(c=>`<option value="${c.id}" ${c.id===t?.cardId?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field hidden" id="installmentField"><label>Parcelas</label><input id="tInstallments" type="number" min="1" value="${t?.installments||1}"></div><div class="field hidden" id="dueField"><label>Primeiro vencimento</label><input id="tDue" type="date" value="${t?.firstDueDate||today()}"></div></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="saveTransaction('${t?.id||''}')">Salvar</button><button class="btn gray" onclick="closeModal()">Cancelar</button></div>`);if(t?.payment)document.getElementById('tPayment').value=t.payment;toggleTransactionFields()}
function toggleTransactionFields(){let income=document.getElementById('tType').value==='income',credit=!income&&document.getElementById('tPayment').value==='credit';document.getElementById('paymentField').classList.toggle('hidden',income);document.getElementById('accountField').classList.toggle('hidden',credit);document.getElementById('cardField').classList.toggle('hidden',!credit);document.getElementById('installmentField').classList.toggle('hidden',!credit);document.getElementById('dueField').classList.toggle('hidden',!credit)}
function addMonths(date,n){let d=new Date(date+'T12:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)}
function saveTransaction(editId){let type=document.getElementById('tType').value,amount=Number(document.getElementById('tAmount').value),date=document.getElementById('tDate').value,categoryId=document.getElementById('tCat').value;if(!amount||amount<=0||!date)return alert('Preencha valor e data.');if(editId)removeTransaction(editId,true);let payment=type==='income'?'income':document.getElementById('tPayment').value,accountId=type==='income'?document.getElementById('tAccount').value:(payment==='credit'?null:document.getElementById('tAccount').value),cardId=payment==='credit'?document.getElementById('tCard').value:null,installments=payment==='credit'?Math.max(1,Number(document.getElementById('tInstallments').value)):1,firstDueDate=payment==='credit'?document.getElementById('tDue').value:null;let t={id:uid(),type,amount,categoryId,date,accountId,payment,cardId,installments,firstDueDate};data.transactions.push(t);if(payment==='credit'){let each=amount/installments;for(let n=1;n<=installments;n++)data.installments.push({id:uid(),purchaseId:t.id,cardId,categoryId,amount:each,totalAmount:amount,installmentNumber:n,totalInstallments:installments,dueDate:addMonths(firstDueDate,n-1),invoiceKey:cardId+'_'+monthKey(addMonths(firstDueDate,n-1))})}save();closeModal();render()}
function removeTransaction(id,silent=false){let t=data.transactions.find(x=>x.id===id);if(!t)return;data.transactions=data.transactions.filter(x=>x.id!==id);data.installments=data.installments.filter(i=>i.purchaseId!==id);if(!silent&&!confirm('Apagar este lançamento?'))return save(),render();save();render()}
function openAccount(existing=null){let a=existing?data.accounts.find(x=>x.id===existing):null;modal(`<h2>${a?'Editar':'Nova'} conta</h2><div class="form-grid"><div class="field"><label>Nome</label><input id="aName" value="${a?.name||''}" placeholder="Nubank, Mercado Pago..."></div><div class="field"><label>Tipo</label><select id="aType"><option value="bank" ${a?.type!=='cash'?'selected':''}>Conta bancária</option><option value="cash" ${a?.type==='cash'?'selected':''}>Carteira / dinheiro</option></select></div><div class="field full"><label>Saldo inicial</label><input id="aBalance" type="number" step="0.01" value="${a?.initialBalance||0}"></div></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="saveAccount('${a?.id||''}')">Salvar</button><button class="btn gray" onclick="closeModal()">Cancelar</button></div>`)}
function editAccount(id){openAccount(id)}function saveAccount(id){let name=document.getElementById('aName').value.trim();if(!name)return alert('Informe o nome.');let a={id:id||uid(),name,type:document.getElementById('aType').value,initialBalance:Number(document.getElementById('aBalance').value)||0};if(id)data.accounts=data.accounts.map(x=>x.id===id?a:x);else data.accounts.push(a);save();closeModal();render()}
function openCard(existing=null){let c=existing?data.cards.find(x=>x.id===existing):null;modal(`<h2>${c?'Editar':'Novo'} cartão</h2><div class="form-grid"><div class="field full"><label>Nome do cartão</label><input id="cName" value="${c?.name||''}" placeholder="Nubank crédito"></div><div class="field"><label>Conta vinculada</label><select id="cAccount"><option value="">Sem conta</option>${data.accounts.map(a=>`<option value="${a.id}" ${a.id===c?.accountId?'selected':''}>${a.name}</option>`).join('')}</select></div><div class="field"><label>Dia de vencimento</label><input id="cDue" type="number" min="1" max="31" value="${c?.dueDay||10}"></div><div class="field"><label>Dia de fechamento (opcional)</label><input id="cClose" type="number" min="1" max="31" value="${c?.closingDay||''}"></div><div class="field"><label>Limite (opcional)</label><input id="cLimit" type="number" step="0.01" value="${c?.limit||''}"></div></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="saveCard('${c?.id||''}')">Salvar</button><button class="btn gray" onclick="closeModal()">Cancelar</button></div>`)}
function saveCard(id){let name=document.getElementById('cName').value.trim();if(!name)return alert('Informe o nome.');let c={id:id||uid(),name,accountId:document.getElementById('cAccount').value, dueDay:Number(document.getElementById('cDue').value)||10,closingDay:document.getElementById('cClose').value,limit:Number(document.getElementById('cLimit').value)||null};if(id)data.cards=data.cards.map(x=>x.id===id?c:x);else data.cards.push(c);save();closeModal();render()}
function accountDetail(id){let a=data.accounts.find(x=>x.id===id),tx=data.transactions.filter(t=>t.accountId===id||data.cards.some(c=>c.id===t.cardId&&c.accountId===id));modal(`<h2>${a.name}</h2><div class="card" style="box-shadow:none;background:#f8fafc"><small>Saldo atual</small><div class="balance ${accountBalance(id)>=0?'positive':'negative'}">${money(accountBalance(id))}</div></div><h3>Movimentações</h3><div class="list">${tx.length?tx.sort((x,y)=>y.date.localeCompare(x.date)).map(t=>`<div class="item"><div><b>${catName(t.categoryId)}</b><div class="muted">${dateBR(t.date)} · ${t.payment==='credit'?'Compra no crédito':t.payment}</div></div><b class="${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'-'}${money(t.amount)}</b></div>`).join(''):'<div class="empty">Nenhuma movimentação.</div>'}</div><div class="actions" style="margin-top:18px"><button class="btn gray" onclick="closeModal()">Fechar</button></div>`)}
function cardDetail(id){let c=data.cards.find(x=>x.id===id),is=invoiceGroups().filter(i=>i.cardId===id);modal(`<h2>${c.name}</h2><p class="muted">Conta vinculada: ${data.accounts.find(a=>a.id===c.accountId)?.name||'Nenhuma'}</p>${is.length?is.map(i=>`<div class="invoice"><div class="row"><b>${dateBR(i.dueDate)}</b><b>${money(i.amount)}</b></div><span class="pill ${i.paid?'green':'red'}">${i.paid?'Paga':'Pendente'}</span><button class="btn gray small" style="margin-top:10px" onclick="invoiceDetail('${i.key}')">Detalhes</button></div>`).join(''):'<div class="empty">Nenhuma fatura.</div>'}<div class="actions" style="margin-top:18px"><button class="btn gray" onclick="closeModal()">Fechar</button></div>`)}
function invoiceDetail(key){let i=invoiceGroups().find(x=>x.key===key);if(!i)return;modal(`<h2>${i.cardName}</h2><p class="muted">Vencimento: ${dateBR(i.dueDate)} · Total: ${money(i.amount)}</p><div class="list">${i.items.map(x=>`<div class="item"><div><b>${catName(x.categoryId)}</b><div class="muted">Parcela ${x.installmentNumber}/${x.totalInstallments}</div></div><b>${money(x.amount)}</b></div>`).join('')}</div><div class="actions" style="margin-top:18px">${!i.paid?`<button class="btn" onclick="payInvoice('${key}')">Pagar fatura</button>`:''}<button class="btn gray" onclick="closeModal()">Fechar</button></div>`)}
function payInvoice(key){let i=invoiceGroups().find(x=>x.key===key);if(!i||i.paid)return;let c=data.cards.find(x=>x.id===i.cardId);if(!c?.accountId)return alert('Vincule este cartão a uma conta antes de pagar a fatura.');if(!confirm(`Confirmar pagamento de ${money(i.amount)}?`))return;data.payments.push({id:uid(),cardId:i.cardId,accountId:c.accountId,invoiceKey:key,amount:i.amount,date:today()});save();closeModal();render()}
function openCategory(){modal(`<h2>Nova categoria</h2><div class="form-grid"><div class="field"><label>Nome</label><input id="catNameInput"></div><div class="field"><label>Tipo</label><select id="catType"><option value="expense">Gastos</option><option value="income">Ganhos</option><option value="both">Geral</option></select></div></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="saveCategory()">Salvar</button><button class="btn gray" onclick="closeModal()">Cancelar</button></div>`)}
function saveCategory(){let name=document.getElementById('catNameInput').value.trim();if(!name)return;data.categories.push({id:uid(),name,type:document.getElementById('catType').value});save();closeModal();render()}
function removeCategory(id){if(data.transactions.some(t=>t.categoryId===id)||data.installments.some(i=>i.categoryId===id))return alert('Esta categoria está sendo usada em lançamentos.');if(confirm('Apagar categoria?')){data.categories=data.categories.filter(c=>c.id!==id);save();render()}}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pierre-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=normalize(JSON.parse(r.result));if(confirm('Restaurar este backup e substituir os dados atuais?')){data=x;save();render();alert('Backup restaurado com sucesso.')}}catch{alert('Arquivo inválido.')}};r.readAsText(f)}
function clearAll(){if(confirm('Isso apagará todos os dados. Continuar?')){data=blank();save();render()}}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});try{render()}catch(error){document.getElementById('content').innerHTML='<div class="card"><h2>Erro ao carregar o aplicativo</h2><p>Atualize a página. Se continuar, abra em uma aba normal do Safari e tente novamente.</p><small>'+String(error.message||error)+'</small></div>';console.error(error)}
</script></body></html>
